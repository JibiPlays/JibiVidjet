<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JibiVidjet</title><link rel="stylesheet" href="styles/main.css"></head><body><div class="scene" id="scene"><div class="ground"></div><div class="chat-layer" id="chatLayer"></div></div><script type="module">
import {loadState,saveState} from './src/state.js';
import {createViewer,moveViewers,randomizeVelocity} from './src/movement.js';
import {renderViewer,renderViewers} from './src/viewers.js';
let state=loadState();
const initialViewers=[['viewer-1','Зритель 1',22,30],['viewer-2','Зритель 2',50,48],['viewer-3','Зритель 3',78,30],['viewer-4','Зритель 4',30,72],['viewer-5','Зритель 5',70,72]];
for(const [id,name,x,y] of initialViewers){if(!state.viewers[id])state.viewers[id]=createViewer(id,name,x,y);else if(!state.viewers[id].type)state.viewers[id].type=Math.floor(Math.random()*5)+1}
function addChatMessage(user,text){state.messages.push({id:crypto.randomUUID(),user:String(user),text:String(text),createdAt:Date.now()});if(state.messages.length>20)state.messages.shift();saveState(state);renderMessages()}
function renderMessages(){const layer=document.getElementById('chatLayer');layer.replaceChildren();for(const m of state.messages){const row=document.createElement('div');row.className='chat-message';const name=document.createElement('span');name.className='chat-name';name.textContent=m.user+':';const text=document.createElement('span');text.textContent=m.text;row.append(name,text);layer.appendChild(row)}}
if(state.messages.length===0){addChatMessage('Jibi','Тестовое сообщение из чата');addChatMessage('Зритель','Проверяем сохранение состояния')}
for(const v of Object.values(state.viewers)){if(!Number.isFinite(v.vx)||!Number.isFinite(v.vy)||!Number.isFinite(v.nextTurn))randomizeVelocity(v)}
renderViewers(state.viewers);renderMessages();
let last=Date.now(),lastSave=0;
function animate(){const now=Date.now(),dt=Math.min(.05,(now-last)/1000);last=now;moveViewers(state.viewers,dt,now);for(const v of Object.values(state.viewers))renderViewer(v);if(now-lastSave>250){saveState(state);lastSave=now}requestAnimationFrame(animate)}requestAnimationFrame(animate);window.addEventListener('pagehide',()=>saveState(state));window.addEventListener('beforeunload',()=>saveState(state));window.JibiVidjet={addChatMessage,getState:()=>JSON.parse(JSON.stringify(state))};
let currentVersion=null;
async function checkForUpdate(){try{const files=['index.html','styles/main.css','src/state.js','src/movement.js','src/viewers.js'];const responses=await Promise.all(files.map(path=>fetch(path+'?check='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('update check failed: '+path);return r.text()})));const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(responses.join('\n/* JibiVidjet file boundary */\n')));const hash=Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');if(currentVersion===null)currentVersion=hash;else if(hash!==currentVersion){saveState(state);location.reload()}}catch(e){}}
checkForUpdate();setInterval(checkForUpdate,5000);
</script></body></html>
