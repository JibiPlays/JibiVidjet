<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JibiVidjet</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
.scene{position:relative;width:100%;height:100%}
.person{position:absolute;left:50%;top:50%;width:220px;height:300px;transform:translate(-50%,-50%)}
.head{position:absolute;left:60px;top:0;width:100px;height:100px;border-radius:50%;background:#00e5ff;border:5px solid #111}
.body{position:absolute;left:75px;top:112px;width:70px;height:95px;border-radius:18px;background:#9c27b0;border:5px solid #111}
.arm{position:absolute;top:120px;width:25px;height:95px;border-radius:14px;background:#00e5ff;border:5px solid #111}
.arm.left{left:30px;transform:rotate(55deg)}
.arm.right{right:30px;transform:rotate(-55deg)}
.leg{position:absolute;top:202px;width:28px;height:95px;border-radius:14px;background:#00c853;border:5px solid #111}
.leg.left{left:70px;transform:rotate(8deg)}
.leg.right{right:70px;transform:rotate(-8deg)}
.eye{position:absolute;top:34px;width:14px;height:22px;border-radius:50%;background:#111}
.eye.left{left:88px}.eye.right{right:88px}
.chat-layer{position:absolute;left:20px;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.chat-message{align-self:flex-start;max-width:70%;padding:8px 12px;border-radius:10px;background:rgba(0,0,0,.72);color:#fff;font:16px Arial,sans-serif;border:1px solid rgba(255,255,255,.2)}
.chat-name{font-weight:700;margin-right:8px}
</style>
</head>
<body>
<div class="scene">
  <div class="person" id="person">
    <div class="head"><div class="eye left"></div><div class="eye right"></div></div>
    <div class="body"></div>
    <div class="arm left"></div>
    <div class="arm right"></div>
    <div class="leg left"></div>
    <div class="leg right"></div>
  </div>
  <div class="chat-layer" id="chatLayer"></div>
</div>
<script>
const STATE_KEY = 'JibiVidjet.state.v1';
const defaultState = {version:1,person:{x:50,y:50},viewers:{},messages:[]};

function loadState(){
  try{
    const saved=localStorage.getItem(STATE_KEY);
    if(!saved)return structuredClone(defaultState);
    const parsed=JSON.parse(saved);
    return {...defaultState,...parsed,person:{...defaultState.person,...(parsed.person||{})},viewers:parsed.viewers||{},messages:Array.isArray(parsed.messages)?parsed.messages:[]};
  }catch(e){return structuredClone(defaultState)}
}

let state=loadState();
function saveState(){try{localStorage.setItem(STATE_KEY,JSON.stringify(state))}catch(e){}}
function clamp(value,min,max){return Math.max(min,Math.min(max,Number(value)||0))}
function setPersonPosition(x,y){
  state.person.x=clamp(x,5,95);
  state.person.y=clamp(y,5,95);
  renderPerson();
  saveState();
}
function renderPerson(){
  const person=document.getElementById('person');
  person.style.left=state.person.x+'%';
  person.style.top=state.person.y+'%';
}
function renderMessages(){
  const layer=document.getElementById('chatLayer');
  layer.replaceChildren();
  for(const message of state.messages){
    const row=document.createElement('div');
    row.className='chat-message';
    const name=document.createElement('span');
    name.className='chat-name';
    name.textContent=message.user+':';
    const text=document.createElement('span');
    text.textContent=message.text;
    row.append(name,text);
    layer.appendChild(row);
  }
}
function addChatMessage(user,text){
  state.messages.push({id:crypto.randomUUID(),user:String(user),text:String(text),createdAt:Date.now()});
  if(state.messages.length>20)state.messages.shift();
  saveState();
  renderMessages();
}
function render(){renderPerson();renderMessages()}

if(state.messages.length===0){
  addChatMessage('Jibi','Тестовое сообщение из чата');
  addChatMessage('Зритель','Проверяем сохранение состояния');
}

// Автотест: фигурка сама ходит по нескольким точкам и сохраняет каждую позицию.
// После перезагрузки она продолжит с последней сохранённой позиции.
const testPath=[
  {x:25,y:30},{x:75,y:30},{x:75,y:70},{x:25,y:70},{x:50,y:50}
];
let testIndex=0;
function runMovementTest(){
  const target=testPath[testIndex];
  setPersonPosition(target.x,target.y);
  testIndex=(testIndex+1)%testPath.length;
}
render();
runMovementTest();
setInterval(runMovementTest,3000);

// API для следующего этапа: реальный Twitch-чат и отдельные зрители.
window.JibiVidjet={
  setPersonPosition,
  addChatMessage,
  getState:()=>JSON.parse(JSON.stringify(state))
};

let currentVersion=null;
async function checkForUpdate(){
  try{
    const response=await fetch('index.html?check='+Date.now(),{cache:'no-store'});
    const text=await response.text();
    const version=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));
    const hash=Array.from(new Uint8Array(version)).map(b=>b.toString(16).padStart(2,'0')).join('');
    if(currentVersion===null)currentVersion=hash;
    else if(hash!==currentVersion){saveState();location.reload()}
  }catch(e){}
}
checkForUpdate();
setInterval(checkForUpdate,5000);
</script>
</body>
</html>
