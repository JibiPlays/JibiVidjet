<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JibiVidjet</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
.scene{position:relative;width:100%;height:100%}
.person{position:absolute;left:50%;top:50%;width:220px;height:300px;transform:translate(-50%,-50%)}
.head{position:absolute;left:60px;top:0;width:100px;height:100px;border-radius:50%;background:#ffd54f;border:5px solid #111}
.body{position:absolute;left:75px;top:112px;width:70px;height:95px;border-radius:18px;background:#e53935;border:5px solid #111}
.arm{position:absolute;top:120px;width:25px;height:95px;border-radius:14px;background:#ffd54f;border:5px solid #111}
.arm.left{left:30px;transform:rotate(55deg)}
.arm.right{right:30px;transform:rotate(-55deg)}
.leg{position:absolute;top:202px;width:28px;height:95px;border-radius:14px;background:#1565c0;border:5px solid #111}
.leg.left{left:70px;transform:rotate(8deg)}
.leg.right{right:70px;transform:rotate(-8deg)}
.eye{position:absolute;top:34px;width:14px;height:22px;border-radius:50%;background:#111}
.eye.left{left:88px}.eye.right{right:88px}
</style>
</head>
<body>
<div class="scene">
  <div class="person">
    <div class="head"><div class="eye left"></div><div class="eye right"></div></div>
    <div class="body"></div>
    <div class="arm left"></div>
    <div class="arm right"></div>
    <div class="leg left"></div>
    <div class="leg right"></div>
  </div>
</div>
</body>
</html>
