<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JibiVidjet</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
.scene{position:relative;width:100%;height:100%}
.person{position:absolute;width:220px;height:300px;transform:translate(-50%,-50%)}
.head{position:absolute;left:60px;top:0;width:100px;height:100px;border-radius:50%;background:#00e5ff;border:5px solid #111}
.body{position:absolute;left:75px;top:112px;width:70px;height:95px;border-radius:18px;background:#9c27b0;border:5px solid #111}
.arm{position:absolute;top:120px;width:25px;height:95px;border-radius:14px;background:#00e5ff;border:5px solid #111}
.arm.left{left:30px;transform:rotate(55deg)}.arm.right{right:30px;transform:rotate(-55deg)}
.leg{position:absolute;top:202px;width:28px;height:95px;border-radius:14px;background:#00c853;border:5px solid #111}
.leg.left{left:70px;transform:rotate(8deg)}.leg.right{right:70px;transform:rotate(-8deg)}
.eye{position:absolute;top:34px;width:14px;height:22px;border-radius:50%;background:#111}
.eye.left{left:88px}.eye.right{right:88px}
.chat-layer{position:absolute;left:20px;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.chat-message{align-self:flex-start;max-width:70%;padding:8px 12px;border-radius:10px;background:rgba(0,0,0,.72);color:#fff;font:16px Arial,sans-serif;border:1px solid rgba(255,255,255,.2)}
.chat-name{font-weight:700;margin-right:8px}
</style>
</head>
<body>
<div class="scene" id="scene"><div class="chat-layer" id="chatLayer"></div></div>
<script>
const STATE_KEY='JibiVidjet.state.v5';
const LEGACY_KEYS=['JibiVidjet.state.v4','JibiVidjet.state.v3','JibiVidjet.state.v2','JibiVidjet.state.v1'];
const defaultState={version:6,viewers:{},messages:[]};
function decodeHashState(){try{const raw=location.hash.startsWith('#jstate=')?decodeURIComponent(location.hash.slice(8)):'';if(!raw)return null;const p=JSON.parse(atob(raw));if(!p||typeof p!=='object')return null;return {...defaultState,...p,viewers:p.viewers||{},messages:Array.isArray(p.messages)?p.messages:[]}}catch(e){return null}}
function readStorage(key){try{const saved=localStorage.getItem(key);if(!saved)return null;const p=JSON.parse(saved);return {...defaultState,...p,viewers:p.viewers||{},messages:Array.isArray(p.messages)?p.messages:[]}}catch(e){return null}}
function loadState(){const fromHash=decodeHashState();if(fromHash)return fromHash;const current=readStorage(STATE_KEY);if(current)return current;for(const key of LEGACY_KEYS){const old=readStorage(key);if(old)return old}return structuredClone(defaultState)}
let state=loadState();
function compactState(){return {version:6,viewers:state.viewers,messages:state.messages}}
function saveState(){try{const json=JSON.stringify(compactState());localStorage.setItem(STATE_KEY,json);for(const key of LEGACY_KEYS)localStorage.removeItem(key);const encoded=btoa(json);history.replaceState(null,'',location.pathname+location.search+'#jstate='+encodeURIComponent(encoded))}catch(e){}}
function clamp(v,min,max){return Math.max(min,Math.min(max,Number(v)||0))}
function randomRange(min,max){return min+Math.random()*(max-min)}
function createViewer(id,name,x,y){state.viewers[id]={id,name,x:clamp(x,8,92),y:clamp(y,10,82),vx:randomRange(-7,7),vy:randomRange(-5,5),nextTurn:Date.now()+randomRange(700,2200)}}
const initialViewers=[['viewer-1','Зритель 1',22,30],['viewer-2','Зритель 2',50,48],['viewer-3','Зритель 3',78,30],['viewer-4','Зритель 4',30,72],['viewer-5','Зритель 5',70,72]];
for(const [id,name,x,y] of initialViewers){if(!state.viewers[id])createViewer(id,name,x,y)}
function ensureViewerElement(v){let el=document.getElementById('viewer-'+v.id);if(el)return el;el=document.createElement('div');el.className='person';el.id='viewer-'+v.id;el.innerHTML='<div class="head"><div class="eye left"></div><div class="eye right"></div></div><div class="body"></div><div class="arm left"></div><div class="arm right"></div><div class="leg left"></div><div class="leg right"></div>';document.getElementById('scene').appendChild(el);return el}
function renderViewer(v){const el=ensureViewerElement(v);el.style.left=v.x+'%';el.style.top=v.y+'%'}
function renderViewers(){Object.values(state.viewers).forEach(renderViewer)}
function addChatMessage(user,text){state.messages.push({id:crypto.randomUUID(),user:String(user),text:String(text),createdAt:Date.now()});if(state.messages.length>20)state.messages.shift();saveState();renderMessages()}
function renderMessages(){const layer=document.getElementById('chatLayer');layer.replaceChildren();for(const m of state.messages){const row=document.createElement('div');row.className='chat-message';const name=document.createElement('span');name.className='chat-name';name.textContent=m.user+':';const text=document.createElement('span');text.textContent=m.text;row.append(name,text);layer.appendChild(row)}}
if(state.messages.length===0){state.messages=[{id:'test-1',user:'Jibi',text:'Тестовое сообщение из чата',createdAt:Date.now()},{id:'test-2',user:'Зритель',text:'Проверяем сохранение состояния',createdAt:Date.now()}];saveState()}
function randomizeVelocity(v){const speed=randomRange(4,11),angle=Math.random()*Math.PI*2;v.vx=Math.cos(angle)*speed;v.vy=Math.sin(angle)*speed;v.nextTurn=Date.now()+randomRange(700,2600)}
for(const v of Object.values(state.viewers)){if(!Number.isFinite(v.vx)||!Number.isFinite(v.vy)||!Number.isFinite(v.nextTurn))randomizeVelocity(v)}
renderViewers();renderMessages();
let last=Date.now(),lastSave=0;
function animate(){const now=Date.now(),dt=Math.min(.05,(now-last)/1000);last=now;for(const v of Object.values(state.viewers)){if(now>=v.nextTurn)randomizeVelocity(v);v.x+=v.vx*dt;v.y+=v.vy*dt;const minX=8,maxX=92,minY=10,maxY=82;if(v.x<=minX){v.x=minX;v.vx=Math.abs(v.vx)}if(v.x>=maxX){v.x=maxX;v.vx=-Math.abs(v.vx)}if(v.y<=minY){v.y=minY;v.vy=Math.abs(v.vy)}if(v.y>=maxY){v.y=maxY;v.vy=-Math.abs(v.vy)}renderViewer(v)}if(now-lastSave>=250){saveState();lastSave=now}requestAnimationFrame(animate)}
requestAnimationFrame(animate);
window.addEventListener('pagehide',saveState);window.addEventListener('beforeunload',saveState);
window.JibiVidjet={addChatMessage,getState:()=>JSON.parse(JSON.stringify(state))};
let currentVersion=null;
async function checkForUpdate(){try{const r=await fetch('index.html?check='+Date.now(),{cache:'no-store'});const text=await r.text();const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));const hash=Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');if(currentVersion===null)currentVersion=hash;else if(hash!==currentVersion){saveState();location.reload()}}catch(e){}}
checkForUpdate();setInterval(checkForUpdate,5000);
</script>
</body>
</html>
